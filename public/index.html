<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบจัดการข้อมูลประวัตินักศึกษา</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <!-- ฟอร์มเข้าสู่ระบบ (Login) -->
    <div id="login-section">
      <h2>🔑 เข้าสู่ระบบ</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="login-username">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="login-username" placeholder="กรอกชื่อผู้ใช้" required>
        </div>
        <div class="form-group">
          <label for="login-password">รหัสผ่าน (Password)</label>
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่าน" required>
        </div>
        <button type="submit">เข้าสู่ระบบ</button>
      </form>
      <div class="switch-form">
        ยังไม่มีบัญชีใช่ไหม? <a href="#" id="go-to-register">สมัครสมาชิกที่นี่</a>
      </div>
    </div>

    <!-- ฟอร์มสมัครสมาชิก (Register) - ซ่อนไว้ก่อนเริ่มต้น -->
    <div id="register-section" style="display: none;">
      <h2>📝 สมัครสมาชิกใหม่</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="register-username">ชื่อผู้ใช้ (Username)</label>
          <input type="text" id="register-username" placeholder="ตั้งชื่อผู้ใช้ของคุณ" required>
        </div>
        <div class="form-group">
          <label for="register-password">รหัสผ่าน (Password)</label>
          <input type="password" id="register-password" placeholder="ตั้งรหัสผ่านของคุณ" required>
        </div>
        <button type="submit" style="background-color: var(--secondary-color);">ยืนยันการสมัครสมาชิก</button>
      </form>
      <div class="switch-form">
        มีบัญชีอยู่แล้ว? <a href="#" id="go-to-login">กลับไปหน้าล็อกอิน</a>
      </div>
    </div>
  </div>

  <!-- เชื่อมต่อไฟล์ Logic การทำงานของระบบสมาชิก -->
  <script src="js/auth.js"></script>
</body>
</html>
